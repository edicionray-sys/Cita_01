<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación a la Aventura 🏔️❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Montserrat:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2d4a22;
            --secondary: #8c6d46;
            --accent: #b23b23;
            --paper: #f4efe3;
            --text-dark: #2b2b2b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.5)), 
                        url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80') center/cover fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-dark);
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(244, 239, 227, 0.95);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            padding: 30px;
            backdrop-filter: blur(5px);
            border: 2px solid var(--secondary);
            position: relative;
        }

        /* Reproductor de Música */
        .audio-control {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 10;
        }

        /* Sobre Digital y Sello */
        .envelope-wrapper {
            background: #e8dfcc;
            border: 2px dashed var(--secondary);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }

        .wax-seal-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
        }

        .seal-option {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            border: 3px solid transparent;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.4), 0 4px 6px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        .seal-option.selected {
            border-color: #gold;
            transform: scale(1.1);
        }

        /* Mensaje de la Invitación */
        .invitation-card {
            background: var(--paper);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #d4c8b0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-family: 'Playfair Display', serif;
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--secondary);
            margin-bottom: 20px;
            font-weight: 700;
        }

        .message-input {
            width: 100%;
            min-height: 120px;
            font-family: 'Caveat', cursive;
            font-size: 1.8rem;
            line-height: 1.4;
            color: #1a3311;
            background: transparent;
            border: 1px dashed var(--secondary);
            border-radius: 8px;
            padding: 15px;
            resize: vertical;
            text-align: center;
            outline: none;
        }

        /* Contador Regresivo */
        .countdown-container {
            background: var(--primary);
            color: #fff;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 30px;
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .time-box {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            min-width: 70px;
        }

        .time-box span {
            display: block;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .time-box label {
            font-size: 0.75rem;
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* Galería y Bordes Florales */
        .gallery-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .border-picker {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .border-btn {
            background: #fff;
            border: 1px solid var(--secondary);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .border-btn.active {
            background: var(--secondary);
            color: #fff;
        }

        .gallery-frame {
            padding: 20px;
            border-radius: 12px;
            background: #fff;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        /* Estilos de Bordes Florales */
        .border-rosas { border: 10px solid #e8a5a5; border-image: linear-gradient(to right, #e8a5a5, #dd7b7b) 1; }
        .border-silvestre { border: 10px solid #8fad88; border-image: linear-gradient(to right, #8fad88, #5c8254) 1; }
        .border-pino { border: 10px solid #5c4033; border-image: linear-gradient(to right, #5c4033, #3b281f) 1; }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .gallery-item {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }

        .share-btn {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(178, 59, 35, 0.3);
            transition: transform 0.2s;
        }

        .share-btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="container">
    <button class="audio-control" onclick="toggleAudio()">
        <span id="audio-icon">🎻</span>
        <span id="audio-text">Música: On</span>
    </button>

    <div class="envelope-wrapper">
        <h3>Elige el Sello de Cera para tu Sobre</h3>
        <div class="wax-seal-selector">
            <div class="seal-option selected" onclick="selectSeal(this, '❤️')">❤️</div>
            <div class="seal-option" onclick="selectSeal(this, '🧭')">🧭</div>
            <div class="seal-option" onclick="selectSeal(this, '🌿')">🌿</div>
            <div class="seal-option" onclick="selectSeal(this, '🏔️️')">🏔️</div>
        </div>
    </div>

    <div class="invitation-card">
        <h1 class="title">Ruta de Amor & Aventura</h1>
        <div class="subtitle">Invitación Oficial de Hiking</div>
        
        <textarea class="message-input" id="custom-message" placeholder="Escribe tu mensaje romántico de explorador aquí...">¡Hola mi amor! Te invito a una aventura especial para caminar juntos al cerro, respirar aire fresco y disfrutar del atardecer mano a mano. ¿Aceptas el reto?</textarea>
        
        <div style="margin-top: 20px;">
            <label for="event-date" style="font-weight: 600; font-size: 0.9rem;">Fecha de la Cita: </label>
            <input type="datetime-local" id="event-date" onchange="updateCountdown()" style="padding: 5px; border-radius: 4px; border: 1px solid #ccc;">
        </div>
    </div>

    <div class="countdown-container">
        <h3>Tiempo para Nuestra Aventura</h3>
        <div class="timer">
            <div class="time-box"><span id="days">00</span><label>Días</label></div>
            <div class="time-box"><span id="hours">00</span><label>Horas</label></div>
            <div class="time-box"><span id="minutes">00</span><label>Minutos</label></div>
            <div class="time-box"><span id="seconds">00</span><label>Segundos</label></div>
        </div>
    </div>

    <div class="gallery-section">
        <h3>Galería de Recuerdos Especiales</h3>
        <p style="font-size: 0.85rem; color: #666;">Selecciona un borde floral para enmarcar las fotos:</p>
        
        <div class="border-picker">
            <button class="border-btn active" onclick="setBorder('border-rosas', this)">Rosas Románticas</button>
            <button class="border-btn" onclick="setBorder('border-silvestre', this)">Bosque Silvestre</button>
            <button class="border-btn" onclick="setBorder('border-pino', this)">Pino Campestre</button>
        </div>

        <div class="gallery-frame border-rosas" id="gallery-frame">
            <input type="file" id="image-upload" multiple accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
            <button onclick="document.getElementById('image-upload').click()" style="background: #f0f0f0; border: 1px dashed #aaa; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-bottom: 15px;">
                📸 Añadir Fotos de Nosotros
            </button>
            <div class="gallery-grid" id="gallery-grid">
                <img src="https://images.unsplash.com/photo-1501555088652-021faa106b9b?auto=format&fit=crop&w=400&q=80" class="gallery-item" alt="Hiking 1">
                <img src="https://images.unsplash.com/photo-1527529482837-4698179dc6ce?auto=format&fit=crop&w=400&q=80" class="gallery-item" alt="Hiking 2">
            </div>
        </div>
    </div>

    <button class="share-btn" onclick="generateShareLink()">🔗 Copiar Enlace para Enviar</button>
</div>

<script>
    // Música suave de violín sintética (Web Audio API)
    let audioCtx = null;
    let isPlaying = false;
    let timerInterval = null;

    function playViolinNotes() {
        if (!isPlaying) return;
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00]; // Escala suave
        const note = notes[Math.floor(Math.random() * notes.length)];

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(note, audioCtx.currentTime);

        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.5);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 2.5);

        setTimeout(playViolinNotes, 1800);
    }

    function toggleAudio() {
        isPlaying = !isPlaying;
        const btnText = document.getElementById('audio-text');
        if (isPlaying) {
            btnText.innerText = 'Música: On';
            playViolinNotes();
        } else {
            btnText.innerText = 'Música: Off';
        }
    }

    // Configurar Fecha por Defecto (7 días adelante)
    const defaultDate = new Date();
    defaultDate.setDate(defaultDate.getDate() + 7);
    document.getElementById('event-date').value = defaultDate.toISOString().slice(0, 16);

    function updateCountdown() {
        clearInterval(timerInterval);
        const targetDate = new Date(document.getElementById('event-date').value).getTime();

        timerInterval = setInterval(() => {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                clearInterval(timerInterval);
                document.getElementById('days').innerText = "00";
                document.getElementById('hours').innerText = "00";
                document.getElementById('minutes').innerText = "00";
                document.getElementById('seconds').innerText = "00";
                return;
            }

            document.getElementById('days').innerText = String(Math.floor(distance / (1000 * 60 * 60 * 24))).padStart(2, '0');
            document.getElementById('hours').innerText = String(Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
            document.getElementById('minutes').innerText = String(Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
            document.getElementById('seconds').innerText = String(Math.floor((distance % (1000 * 60)) / 1000)).padStart(2, '0');
        }, 1000);
    }

    // Selección de Sello de Cera
    function selectSeal(element, sealIcon) {
        document.querySelectorAll('.seal-option').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
    }

    // Bordes Florales
    function setBorder(className, button) {
        document.querySelectorAll('.border-btn').forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        
        const frame = document.getElementById('gallery-frame');
        frame.className = 'gallery-frame ' + className;
    }

    // Cargar Imágenes
    function handleImageUpload(event) {
        const files = event.target.files;
        const grid = document.getElementById('gallery-grid');

        for (let file of files) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.createElement('img');
                img.src = e.target.result;
                img.className = 'gallery-item';
                grid.appendChild(img);
            };
            reader.readAsDataURL(file);
        }
    }

    // Generar Enlace Compartible
    function generateShareLink() {
        const msg = encodeURIComponent(document.getElementById('custom-message').value);
        const date = encodeURIComponent(document.getElementById('event-date').value);
        const shareUrl = `${window.location.origin}${window.location.pathname}?msg=${msg}&date=${date}`;

        navigator.clipboard.writeText(shareUrl).then(() => {
            alert('¡Enlace copiado al portapapeles! Ahora puedes enviárselo a tu pareja por WhatsApp o mensaje.');
        });
    }

    // Cargar Parámetros de la URL al Abrir
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('msg')) {
            document.getElementById('custom-message').value = decodeURIComponent(urlParams.get('msg'));
        }
        if (urlParams.has('date')) {
            document.getElementById('event-date').value = decodeURIComponent(urlParams.get('date'));
        }
        updateCountdown();
    };
</script>

</body>
</html>
